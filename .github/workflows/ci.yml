name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools"

      - name: Install Android 37 preview platform
        run: android --no-metrics sdk install --beta platforms/android-37 build-tools/36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Run unit tests, lint, and debug assembly
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Inspect debug APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          [[ -f "${apk_path}" ]] || { printf 'Debug APK not found: %s\n' "${apk_path}" >&2; exit 1; }
          metadata="$(${ANDROID_HOME}/build-tools/36.0.0/aapt2 dump badging "${apk_path}")"
          printf '%s\n' "${metadata}"
          grep -Fq "name='me.shadow.eclipse.debug'" <<< "${metadata}"
          grep -Fq "versionCode='1'" <<< "${metadata}"
          grep -Fq "versionName='0.1.0-debug'" <<< "${metadata}"
          grep -Fq "sdkVersion:'26'" <<< "${metadata}"
          grep -Fq "targetSdkVersion:'36'" <<< "${metadata}"
          grep -Fq "application-label:'Eclipse Launcher'" <<< "${metadata}"
          while IFS= read -r permission_line; do
            [[ -n "${permission_line}" ]] || continue
            if [[ "${permission_line}" != *"name='me.shadow.eclipse.debug.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'"* ]]; then
              printf 'Unexpected Phase 1 permission: %s\n' "${permission_line}" >&2
              exit 1
            fi
          done < <(grep '^uses-permission:' <<< "${metadata}" || true)
          printf 'APK identity inspection: PASS\n'
