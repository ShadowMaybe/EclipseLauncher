org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.4.1 embeds Kotlin 2.2.10, while Compose BOM 2026.09.00 and the
# selected current toolchain use Kotlin/Compose compiler 2.4.20. These documented
# compatibility flags must be removed when AGP embeds a compatible compiler.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
